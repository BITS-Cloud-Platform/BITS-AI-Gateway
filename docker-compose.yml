# Pin compose project name so CLI runs and Arcane deployments
# always target the same containers/network (prevents duplicates).
name: bitsaigateway

services:
  9router:
    image: ghcr.io/decolua/9router:latest
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:20128/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # Optional: Headroom sidecar
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network


networks:
  app-network:
    name: bitsaigateway-network
    driver: bridge

volumes:
  data:
    name: bitsaigateway_data
