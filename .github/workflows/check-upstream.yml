name: "🌌 Warp Sync"

on:
  schedule:
    - cron: '0 0 * * *' # Daily 07:00 WIB
  workflow_dispatch:

jobs:
  warp-hunter:
    name: "🛰️ Warp Hunter"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v4

      - name: "🧬 Check 9Router"
        id: router
        run: |
          docker pull ghcr.io/decolua/9router:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/decolua/9router:latest | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "9Router: $DIGEST"

      - name: "🎩 Check Headroom"
        id: headroom
        run: |
          docker pull ghcr.io/chopratejas/headroom:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/chopratejas/headroom:latest | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Headroom: $DIGEST"

      - name: "⚖️ Compare"
        run: |
          mkdir -p .upstream
          echo "${{ steps.router.outputs.digest }}" > .upstream/9router.digest
          echo "${{ steps.headroom.outputs.digest }}" > .upstream/headroom.digest
          git diff --color || true
          git diff --quiet && echo "No update" && exit 0
          echo "New warp found"

      - name: "💾 Push"
        run: |
          git diff --quiet && exit 0
          git config user.name "Warp Bot 🤖"
          git config user.email "warp-bot@bits.co.id"
          git add .upstream/
          git commit -m "chore: bump 9router ${{ steps.router.outputs.digest }}"
          git push
